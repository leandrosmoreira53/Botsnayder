[package]
name = "polymarket-arbitrage-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "derive_api_keys"
path = "src/bin/derive_api_keys.rs"

[[bin]]
name = "polymarket-arbitrage-bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rust_decimal = "1.33"
rust_decimal_macros = "1.33"
k256 = "0.13"
sha3 = "0.10"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
ethers = { version = "2.0", features = ["abigen", "rustls"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"

# Polymarket CLOB Client - para derivar API keys e fazer ordens
polymarket-rs-client = "0.1.1"
